# Opens a PR that stamps Formula/txtodo.rb and Casks/txtodo-desktop.rb with the latest
# aaronmyatt/txtodo GitHub release.
#
# Replaces the `brew tap-new` scaffold's `brew bump --open-pr`. That command cannot rewrite this
# formula: every url sits inside on_macos/on_arm|on_intel, next to two extra `resource` blocks, and
# it died with "Could not find 'url' stanza!" (run 35509023900). update-formula.sh and
# update-cask.sh stamp all 16 formula url/sha256 pairs and both cask ones, so this workflow only
# fetches, verifies, stamps, checks and opens the PR. The scripts live in the main repo
# (deploy/homebrew/) and are fetched at the release tag: one copy, no fork to drift.
#
# A PR opened with GITHUB_TOKEN does not start other workflows (tests.yml never runs on it), and
# needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# Workflow syntax: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
name: bump to latest txtodo release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every day at 4:25 UTC
    - cron: 25 4 * * *

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  bump:
    # macOS runner: update-*.sh use BSD `sed -i ''`. Runner labels:
    # https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: aaronmyatt/txtodo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `gh release view` with no tag answers the repo's "Latest" release (never a draft or
      # prerelease): https://cli.github.com/manual/gh_release_view
      - name: Find the latest release and skip if the tap is already on it
        id: latest
        run: |
          tag="$(gh release view --repo "${UPSTREAM}" --json tagName --jq .tagName)"
          current="$(grep -m1 -oE '/releases/download/v[^/]+/' Formula/txtodo.rb | cut -d/ -f4)"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          if [[ "${tag}" == "${current}" ]]; then
            echo "tap is already on ${tag}"
            echo "bump=false" >> "${GITHUB_OUTPUT}"
          elif git ls-remote --exit-code --heads origin "bump/${tag}"; then
            echo "branch bump/${tag} already exists; not opening a second PR"
            echo "bump=false" >> "${GITHUB_OUTPUT}"
          else
            echo "bump=true" >> "${GITHUB_OUTPUT}"
          fi

      # Every macOS and static Linux (musl) binary, the desktop .dmgs and their `.bundle` signatures:
      # https://cli.github.com/manual/gh_release_download
      - name: Download the release's macOS assets
        if: steps.latest.outputs.bump == 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: gh release download "${TAG}" --repo "${UPSTREAM}" --pattern '*macos*' --pattern '*linux*-musl*' --dir assets

      # Same check release.yml's publish job runs, pinned to this exact tag: a file that was not
      # signed by that tag's own release workflow never reaches a sha256 in the formula.
      # https://docs.sigstore.dev/cosign/verifying/verify/#verify-a-signature-on-a-blob
      - name: Verify every asset's Sigstore signature
        if: steps.latest.outputs.bump == 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          brew install cosign
          for f in assets/*; do
            [[ "${f}" == *.bundle ]] && continue
            cosign verify-blob \
              --certificate-identity "https://github.com/${UPSTREAM}/.github/workflows/release.yml@refs/tags/${TAG}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --bundle "${f}.bundle" \
              "${f}"
          done

      # The scripts edit Formula/ and Casks/ beside themselves, so they run from a folder that
      # links to this tap's. Contents API, raw media type:
      # https://docs.github.com/en/rest/repos/contents#get-repository-content
      - name: Stamp the formula and the cask with the main repo's scripts at this tag
        if: steps.latest.outputs.bump == 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          mkdir upstream
          for f in update-formula.sh update-cask.sh stamp-cask-sha.py; do
            gh api -H 'Accept: application/vnd.github.raw' \
              "repos/${UPSTREAM}/contents/deploy/homebrew/${f}?ref=${TAG}" > "upstream/${f}"
          done
          chmod +x upstream/*.sh
          ln -s ../Formula upstream/Formula
          ln -s ../Casks upstream/Casks
          upstream/update-formula.sh "${TAG}" assets
          upstream/update-cask.sh "${TAG}" assets
          rm -rf upstream

      # The check this workflow exists for: brew bump only ever moved the top-level url, so count
      # every url and sha256 that moved. 4 binaries (txtodo, txtodod, txtodo-tui, txtodo-mcp) x 4
      # platforms (macOS and Linux, arm and intel) = 16 formula pairs, 2 cask ones.
      - name: Check every url and sha256 moved
        if: steps.latest.outputs.bump == 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          [[ "$(grep -c "/releases/download/${TAG}/" Formula/txtodo.rb)" == 16 ]]
          [[ "$(grep -cE '/releases/download/v[^/]+/' Formula/txtodo.rb)" == 16 ]]
          [[ "$(git diff -U0 Formula/txtodo.rb | grep -cE '^\+ +sha256 ')" == 16 ]]
          grep -q "version \"${TAG#v}\"" Casks/txtodo-desktop.rb
          [[ "$(git diff -U0 Casks/txtodo-desktop.rb | grep -cE '^\+ +sha256 ')" == 2 ]]
          git diff --stat

      # `app` names the bundle inside the .dmg, and that name follows `productName` in the app's
      # tauri.conf.json: desktop.app through v0.0.2, txtodo.app from v0.0.3. Nothing above notices a
      # rename (the stanza is not a version or a hash), so the PR would look right and
      # `brew install --cask` would then fail. Mount each .dmg and look.
      # https://docs.brew.sh/Cask-Cookbook#stanza-app
      - name: Check the cask's app is inside each .dmg
        if: steps.latest.outputs.bump == 'true'
        run: |
          app="$(sed -nE 's/^[[:space:]]*app "([^"]+)"[[:space:]]*$/\1/p' Casks/txtodo-desktop.rb)"
          [[ -n "${app}" ]]
          for dmg in assets/desktop-macos-*.dmg; do
            mnt="$(mktemp -d)"
            hdiutil attach -readonly -nobrowse -noverify -mountpoint "${mnt}" "${dmg}"
            ls "${mnt}"
            found=false
            [[ -d "${mnt}/${app}" ]] && found=true
            hdiutil detach "${mnt}"
            if [[ "${found}" != true ]]; then
              echo "::error::Casks/txtodo-desktop.rb says app \"${app}\" but ${dmg} does not contain it (listing above). Fix the app stanza on the bump branch by hand."
              exit 1
            fi
          done

      - name: Open the PR
        if: steps.latest.outputs.bump == 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "bump/${TAG}"
          git add Formula/txtodo.rb Casks/txtodo-desktop.rb
          git commit -m "txtodo ${TAG}"
          git push origin "bump/${TAG}"
          # https://cli.github.com/manual/gh_pr_create
          gh pr create --base main --head "bump/${TAG}" \
            --title "txtodo ${TAG}" \
            --body "Stamps every url and sha256 in Formula/txtodo.rb (4 binaries x macOS/Linux x arm/intel) and Casks/txtodo-desktop.rb to https://github.com/${UPSTREAM}/releases/tag/${TAG}. Every asset's Sigstore signature was verified against that tag's release.yml first. Opened by autobump.yml; tests.yml does not run on it, so check it by hand."
